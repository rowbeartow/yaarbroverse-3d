# Publishes the game to GitHub Pages every time main changes.
#
# GitHub Pages has to be switched on once by the repository owner:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then this workflow finishes quietly without publishing anything.
name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ready:
    name: Is GitHub Pages switched on?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$kind" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not switched on yet, so nothing was published. Switch it on at Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi

  publish:
    name: Build and publish
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Game rule tests
        run: npm test
      - name: Build and check the download size
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
