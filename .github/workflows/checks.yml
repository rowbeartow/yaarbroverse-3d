# Runs on every pull request and on main:
#   1. No private terms: fails if a term from the repository secret PRIVATE_TERMS
#      appears in a tracked file, the pull request's title or description, or a
#      commit message.
#   2. The game rule tests and a full build (which also checks the download
#      size). The built game is handed to the browser jobs, so it is built once.
#      The rule tests here are the quick ones: every test but the bot's runs.
#   3. The bot's runs: the rule tests in which a bot plays the game, whole
#      levels among them (tests/bot-runs.ts says which they are). They have a
#      job of their own with an hour to finish in, and each test in it may
#      take five minutes, so a slow machine cannot fail a run by being slow.
#      Here they take about a minute altogether.
#   4. The browser checks, split into parallel shards so a pull request's checks
#      finish in about ten minutes: Chromium (Mac-sized with a keyboard,
#      iPad-sized with touch) in six, WebKit (iPad-sized with touch, the engine
#      behind every iPad browser) in four. Every check runs; each shard runs
#      its share one at a time, as the machines have no graphics card.
#   5. Two summary jobs, named as the required checks always were ("Tests, build
#      and browser checks" and "Browser checks in WebKit (iPad)"), pass only if
#      every job before them passed.
name: Checks

on:
  pull_request:
    # "edited" is here so a changed title or description is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-terms:
    name: No private terms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so every commit message in the pull request can be read.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Look in tracked files, the pull request and commit messages
        # The title and description arrive as environment variables and are
        # never pasted into a command, so their text cannot run as one.
        # The script hides each term in this log (::add-mask::) before it
        # looks, and prints only file and line number.
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-private-terms.mjs

  # Every job but the private-terms check runs inside Playwright's own
  # container image, which already holds the test browsers and every system
  # package they need. Nothing is installed from Ubuntu's servers during a run.
  # The image's version must be the exact Playwright version in package.json:
  # `scripts/check-playwright-image.mjs` fails with a plain message if they
  # differ. To upgrade Playwright, change package.json, package-lock.json and
  # every image line below together.
  build:
    name: Rule tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The user GitHub's own files belong to, and shared memory for Chromium.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The container holds the browsers for this version of Playwright
        run: node scripts/check-playwright-image.mjs
      - name: Game rule tests (all but the bot's runs)
        run: npm run test:rules
      - name: Build and check the download size
        run: npm run build
      - name: Hand the built game to the browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: game
          path: dist
          retention-days: 1

  bot-runs:
    name: Whole-level bot runs
    runs-on: ubuntu-latest
    # About a minute on an ordinary machine. The hour, and the five minutes each
    # test may take (BOT_RUN_LIMIT in tests/bot-runs.ts), are for a slow one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The rule tests in which a bot plays the game
        run: npm run test:bot

  chromium:
    name: Browser checks in Chromium (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The built game
        uses: actions/download-artifact@v4
        with:
          name: game
          path: dist
      - name: Browser checks in Chromium (keyboard, touch and the look), one sixth
        env:
          PREBUILT: '1'
        run: npx playwright test --project=mac --project=ipad --shard=${{ matrix.shard }}/6

  webkit-shards:
    name: Browser checks in WebKit (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The built game
        uses: actions/download-artifact@v4
        with:
          name: game
          path: dist
      - name: Browser checks in WebKit (touch and the look, iPad size), one quarter
        env:
          PREBUILT: '1'
        run: npx playwright test --project=ipad-webkit --shard=${{ matrix.shard }}/4

  # The two names branch protection has always required. Each passes only if
  # every job it stands for passed (a skipped or cancelled one fails it).
  checks:
    name: Tests, build and browser checks
    needs: [build, bot-runs, chromium]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The rule tests, the bot's runs, the build and every Chromium shard passed
        run: test "${{ needs.build.result }}" = success && test "${{ needs.bot-runs.result }}" = success && test "${{ needs.chromium.result }}" = success

  webkit:
    name: Browser checks in WebKit (iPad)
    needs: [build, webkit-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every WebKit shard passed
        run: test "${{ needs.build.result }}" = success && test "${{ needs.webkit-shards.result }}" = success
