# Runs on every pull request and on main:
#   1. No private terms: fails if a term from the repository secret PRIVATE_TERMS
#      appears in a tracked file, the pull request's title or description, or a
#      commit message.
#   2. The game rule tests, a full build (which also checks the download size),
#      then the browser checks in Chromium (Mac-sized with a keyboard, iPad-sized
#      with touch).
#   3. The browser checks in WebKit, the engine behind every iPad browser
#      (iPad-sized with touch).
name: Checks

on:
  pull_request:
    # "edited" is here so a changed title or description is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-terms:
    name: No private terms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so every commit message in the pull request can be read.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Look in tracked files, the pull request and commit messages
        # The title and description arrive as environment variables and are
        # never pasted into a command, so their text cannot run as one.
        # The script hides each term in this log (::add-mask::) before it
        # looks, and prints only file and line number.
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-private-terms.mjs

  # The two browser jobs run inside Playwright's own container image, which
  # already holds the test browsers and every system package they need. Nothing
  # is installed from Ubuntu's servers during a run. The image's version must be
  # the exact Playwright version in package.json: the first step of each job
  # fails with a plain message if the two ever differ. To upgrade Playwright,
  # change package.json, package-lock.json and both image lines together.
  checks:
    name: Tests, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The user GitHub's own files belong to, and shared memory for Chromium.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The container holds the browsers for this version of Playwright
        run: node scripts/check-playwright-image.mjs
      - name: Game rule tests
        run: npm test
      - name: Build and check the download size
        run: npm run build
      - name: Browser checks in Chromium (keyboard, touch and the look)
        run: npx playwright test --project=mac --project=ipad

  webkit:
    name: Browser checks in WebKit (iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The container holds the browsers for this version of Playwright
        run: node scripts/check-playwright-image.mjs
      - name: Browser checks in WebKit (touch and the look, iPad size)
        run: npx playwright test --project=ipad-webkit
